services:
  naukri-bot:
    build: .
    container_name: naukri-bot
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - ./config.json:/app/config.json
      - ./veto.json:/app/veto.json
      - /home/ani/Documents/Resume:/home/ani/Documents/Resume
    environment:
      - PYTHONUNBUFFERED=1
